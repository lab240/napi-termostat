<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>donoff</title>
<style>
:root {
  --bg: #f4f5f8; --card: #ffffff; --text: #1d2330; --muted: #687187; --line: #e1e4ea; --soft: #f0f2f6;
  --accent: #2563eb; --ok: #15803d; --bad: #c2410c; --warn: #a16207; --cool: #0284c7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --card: #1b2029; --text: #e3e7ee; --muted: #8b94a7; --line: #2b323e; --soft: #232a35;
    --accent: #6c9cff; --ok: #4ade80; --bad: #fb923c; --warn: #facc15; --cool: #38bdf8;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 14px 20px; background: var(--card); border-bottom: 1px solid var(--line); }
header h1 { font-size: 18px; margin: 0; }
header .meta { color: var(--muted); }
header .link { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; align-items: center; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-right: 6px; flex: none; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 8px; }
.big { font-size: 44px; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
.big small { font-size: 20px; font-weight: 500; color: var(--muted); }
.sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
.err { color: var(--bad); font-weight: 600; margin-top: 6px; }
.pill { display: inline-flex; align-items: center; padding: 6px 16px; border-radius: 999px; font-size: 22px; font-weight: 700; border: 2px solid currentColor; }
.pill.on { color: var(--cool); } .pill.on.heat { color: var(--bad); } .pill.off { color: var(--muted); }
.fan { display: inline-block; margin-right: 8px; }
.pill.on .fan { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin-top: 10px; font-size: 13px; }
.kv span:nth-child(odd) { color: var(--muted); }
.field { display: grid; grid-template-columns: 120px 110px auto; align-items: center; gap: 8px; margin-bottom: 8px; }
.field label { color: var(--muted); }
input[type=number] { width: 100%; padding: 5px 8px; font: inherit; color: var(--text); background: var(--soft); border: 1px solid var(--line); border-radius: 6px; }
input[type=password] { padding: 5px 8px; font: inherit; color: var(--text); background: var(--soft); border: 1px solid var(--line); border-radius: 6px; max-width: 300px; width: 100%; }
.btn { padding: 6px 14px; font: inherit; border-radius: 6px; border: 1px solid var(--line); background: var(--soft); color: var(--text); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: none; background: var(--soft); color: var(--text); padding: 6px 14px; font: inherit; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: none; }
.seg button.sel { background: var(--accent); color: #fff; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; }
.band { font-size: 13px; color: var(--muted); margin-top: 4px; }
.msg { font-size: 13px; min-height: 1.2em; }
.msg.bad { color: var(--bad); } .msg.ok { color: var(--ok); }
.warnmode { color: var(--warn); font-size: 13px; font-weight: 600; }
.charthead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.charthead h2 { margin: 0; flex: 1; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 5px; }
canvas { width: 100%; height: 260px; display: block; }
.tokenbar { display: none; border-color: var(--warn); } .tokenbar.show { display: block; }
</style>
</head>
<body>
<header>
  <h1>donoff</h1>
  <span class="meta">термостат · <span id="actTitle"></span> · <span id="ver"></span></span>
  <a href="/mqtt" style="margin-left:auto;color:var(--accent);text-decoration:none">MQTT</a>
  <span class="link" style="margin-left:0"><span class="dot" id="linkdot"></span><span id="linktxt">…</span></span>
</header>
<main>
  <div class="card tokenbar" id="tokenbar">
    <div>Этот адрес не из доверенной сети — нужен токен (файл из --token-file).</div>
    <div class="row"><input type="password" id="token" autocomplete="off"><button class="btn primary" id="tokenSave">Сохранить</button></div>
  </div>

  <div class="cards">
    <div class="card">
      <h2>Температура</h2>
      <div class="big" id="temp">—</div>
      <div class="err" id="sensErr" hidden></div>
      <div class="sub" id="sensInfo"></div>
    </div>
    <div class="card">
      <h2 id="loadTitle">Вентилятор</h2>
      <span class="pill off" id="fan"><span class="fan">✣</span><span id="fanTxt">—</span></span>
      <div class="kv">
        <span>Причина</span><span id="reason">—</span>
        <span>С</span><span id="since">—</span>
        <span>Включений</span><span id="switches">—</span>
        <span>Наработка</span><span id="ontime">—</span>
      </div>
      <div class="err" id="relayErr" hidden></div>
    </div>
    <div class="card">
      <h2>Настройки</h2>
      <div class="row" style="margin:0 0 10px">
        <div class="seg" id="action">
          <button data-a="cool">❄ Охлаждение</button><button data-a="heat">🔥 Нагрев</button>
        </div>
      </div>
      <div class="field"><label for="sp">Уставка, °C</label><input type="number" id="sp" step="0.1" min="-40" max="100"><span></span></div>
      <div class="field"><label for="hy">Гистерезис, °C</label><input type="number" id="hy" step="0.1" min="0.1" max="20"><span></span></div>
      <div class="band" id="band"></div>
      <div class="row"><button class="btn primary" id="save" disabled>Сохранить</button><span class="msg" id="msg"></span></div>
      <div class="row">
        <span style="color:var(--muted)">Режим</span>
        <div class="seg" id="mode">
          <button data-m="auto">Авто</button><button data-m="on">Вкл</button><button data-m="off">Выкл</button>
        </div>
      </div>
      <div class="warnmode" id="modeWarn" hidden></div>
    </div>
  </div>

  <div class="card">
    <div class="charthead">
      <h2>История</h2>
      <div class="seg" id="range"><button data-h="1">1 ч</button><button data-h="6" class="sel">6 ч</button><button data-h="24">24 ч</button></div>
    </div>
    <canvas id="chart"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>температура</span>
      <span><i style="background:var(--bad)"></i>уставка (вкл)</span>
      <span><i style="background:var(--ok)"></i><span id="lgOff">нижний край (выкл)</span></span>
      <span><i id="lgBand" style="background:var(--cool);opacity:.35;height:10px"></i><span id="lgLoad">вентилятор работает</span></span>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let token = '';
try { token = localStorage.getItem('donoff-token') || ''; } catch (e) {}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers.Authorization = 'Bearer ' + token;
  const r = await fetch(path, { ...opts, headers });
  if (r.status === 401 || r.status === 403) { $('tokenbar').classList.add('show'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
$('tokenSave').onclick = () => {
  token = $('token').value.trim();
  try { localStorage.setItem('donoff-token', token); } catch (e) {}
  $('tokenbar').classList.remove('show');
  refresh(); loadHistory(true);
};

const reasons = {
  'start': 'запуск',
  'service stopped': 'служба остановлена',
  'manual: on': 'вручную: включён',
  'manual: off': 'вручную: выключен',
  'sensor error: relay off': 'ошибка датчика — выключен',
  'below the setpoint': 'ниже уставки',
  'at or above the high edge': 'нагрето до верхнего края',
  'heating up to the high edge': 'греет до верхнего края',
  'above the setpoint': 'выше уставки',
  'at or below the low edge': 'охлаждено до нижнего края',
  'cooling down to the low edge': 'охлаждает до нижнего края',
  'inside the band': 'в зоне гистерезиса',
};
const fmt1 = v => (Math.round(v * 10) / 10).toFixed(1);
function dur(s) {
  s = Math.max(0, Math.floor(s));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return `${d} д ${h} ч`;
  if (h) return `${h} ч ${m} мин`;
  if (m) return `${m} мин ${s % 60} с`;
  return `${s} с`;
}
const hhmm = d => d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

let st = null, dirty = false;
['sp', 'hy'].forEach(id => $(id).addEventListener('input', () => { dirty = true; $('save').disabled = false; $('msg').textContent = ''; showBand(); }));

const heat = () => st && st.action === 'heat';
function showBand() {
  const sp = parseFloat($('sp').value), hy = parseFloat($('hy').value);
  if (!isFinite(sp) || !isFinite(hy)) { $('band').textContent = ''; return; }
  $('band').textContent = heat()
    ? `вкл при T < ${fmt1(sp)} °C, выкл при T ≥ ${fmt1(sp + hy)} °C; ошибка датчика — выкл`
    : `вкл при T > ${fmt1(sp)} °C, выкл при T ≤ ${fmt1(sp - hy)} °C; ошибка датчика — выкл`;
}

function render(s) {
  st = s;
  $('ver').textContent = s.version;
  const now = new Date(s.now);
  if (s.temp === null) {
    $('temp').innerHTML = '—';
    $('sensErr').hidden = false; $('sensErr').textContent = 'Ошибка датчика: ' + s.sensor_error;
  } else {
    $('temp').innerHTML = `${s.temp.toFixed(2)} <small>°C</small>`;
    $('sensErr').hidden = true;
  }
  $('sensInfo').textContent = `${s.sensor_id || 'датчик не найден'} · опрос ${dur((now - new Date(s.read_at)) / 1000)} назад`;

  const h = s.action === 'heat';
  $('actTitle').textContent = h ? 'нагрев' : 'охлаждение';
  $('loadTitle').textContent = h ? 'Нагреватель' : 'Вентилятор';
  $('lgOff').textContent = h ? 'верхний край (выкл)' : 'нижний край (выкл)';
  $('lgLoad').textContent = h ? 'нагреватель работает' : 'вентилятор работает';
  $('lgBand').style.background = h ? 'var(--bad)' : 'var(--cool)';
  document.querySelectorAll('#action button').forEach(b => b.classList.toggle('sel', b.dataset.a === s.action));
  $('fan').className = 'pill ' + (s.fan ? 'on' : 'off') + (h ? ' heat' : '');
  $('fanTxt').textContent = s.fan ? 'РАБОТАЕТ' : 'СТОИТ';
  $('reason').textContent = reasons[s.reason] || s.reason;
  $('since').textContent = `${hhmm(new Date(s.fan_since))} (${dur((now - new Date(s.fan_since)) / 1000)})`;
  $('switches').textContent = s.switches;
  $('ontime').textContent = `${dur(s.on_seconds)} за ${dur((now - new Date(s.started)) / 1000)}`;
  $('relayErr').hidden = !s.relay_error; $('relayErr').textContent = 'Реле: ' + (s.relay_error || '');

  if (!dirty) { $('sp').value = fmt1(s.setpoint); $('hy').value = fmt1(s.hysteresis); showBand(); }
  document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('sel', b.dataset.m === s.mode));
  $('modeWarn').hidden = s.mode === 'auto';
  $('modeWarn').textContent = s.mode === 'on' ? 'Ручной режим: нагрузка включена постоянно' : 'Ручной режим: нагрузка выключена, датчик не управляет';
  draw();
}

function link(ok, txt) { $('linkdot').className = 'dot ' + (ok ? 'ok' : 'bad'); $('linktxt').textContent = txt; }

async function refresh() {
  try { render(await api('/api/v1/status')); link(true, 'на связи'); }
  catch (e) { link(false, 'нет связи: ' + e.message); }
}

async function put(body) {
  try {
    await api('/api/v1/config', { method: 'PUT', body: JSON.stringify(body) });
    $('msg').className = 'msg ok'; $('msg').textContent = 'сохранено';
    return true;
  } catch (e) { $('msg').className = 'msg bad'; $('msg').textContent = e.message; return false; }
}
$('save').onclick = async () => {
  if (await put({ setpoint: parseFloat($('sp').value), hysteresis: parseFloat($('hy').value) })) {
    dirty = false; $('save').disabled = true; refresh();
  }
};
document.querySelectorAll('#mode button').forEach(b => b.onclick = async () => { await put({ mode: b.dataset.m }); refresh(); });
document.querySelectorAll('#action button').forEach(b => b.onclick = async () => {
  if (st && st.action === b.dataset.a) return;
  if (!confirm(b.dataset.a === 'heat' ? 'Переключить на НАГРЕВ? Реле будет включаться при T ниже уставки.' : 'Переключить на ОХЛАЖДЕНИЕ? Реле будет включаться при T выше уставки.')) return;
  await put({ action: b.dataset.a }); refresh();
});

// history
let hist = [], hours = 6;
document.querySelectorAll('#range button').forEach(b => b.onclick = () => {
  hours = +b.dataset.h;
  document.querySelectorAll('#range button').forEach(x => x.classList.toggle('sel', x === b));
  draw();
});
async function loadHistory(full) {
  try {
    const since = !full && hist.length ? hist[hist.length - 1].t : 0;
    const add = await api('/api/v1/history?since=' + since);
    hist = full ? add : hist.concat(add);
    const cut = Date.now() / 1000 - 86400;
    while (hist.length && hist[0].t < cut) hist.shift();
    draw();
  } catch (e) {}
}

function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function draw() {
  const cv = $('chart'), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
  const L = 44, R = 10, T = 10, B = 24, pw = W - L - R, ph = H - T - B;
  const t1 = Date.now() / 1000, t0 = t1 - hours * 3600;
  const pts = hist.filter(p => p.t >= t0);
  const vals = pts.filter(p => p.c !== null).map(p => p.c);
  if (st) vals.push(st.setpoint, st.off_at);
  if (!vals.length) return;
  let lo = Math.min(...vals) - 0.5, hi = Math.max(...vals) + 0.5;
  const x = t => L + (t - t0) / (t1 - t0) * pw, y = v => T + (hi - v) / (hi - lo) * ph;
  g.font = '11px system-ui, sans-serif'; g.fillStyle = css('--muted'); g.strokeStyle = css('--line'); g.lineWidth = 1;
  // grid: y
  const step = (hi - lo) > 12 ? 2 : (hi - lo) > 5 ? 1 : 0.5;
  g.textAlign = 'right'; g.textBaseline = 'middle';
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    g.beginPath(); g.moveTo(L, y(v)); g.lineTo(W - R, y(v)); g.stroke(); g.fillText(v.toFixed(step < 1 ? 1 : 0), L - 6, y(v));
  }
  // grid: x
  g.textAlign = 'center'; g.textBaseline = 'top';
  const xs = hours <= 1 ? 600 : hours <= 6 ? 3600 : 3 * 3600;
  for (let t = Math.ceil(t0 / xs) * xs; t <= t1; t += xs) g.fillText(hhmm(new Date(t * 1000)), x(t), H - B + 6);
  // fan bands
  g.fillStyle = css(heat() ? '--bad' : '--cool'); g.globalAlpha = 0.18;
  for (let i = 0; i < pts.length; i++) {
    if (!pts[i].fan) continue;
    const a = x(pts[i].t), b = i + 1 < pts.length ? x(pts[i + 1].t) : x(t1);
    g.fillRect(a, T, Math.max(1, b - a), ph);
  }
  g.globalAlpha = 1;
  // setpoint lines
  if (st) {
    g.setLineDash([5, 4]); g.lineWidth = 1.5;
    g.strokeStyle = css('--bad'); g.beginPath(); g.moveTo(L, y(st.setpoint)); g.lineTo(W - R, y(st.setpoint)); g.stroke();
    g.strokeStyle = css('--ok'); g.beginPath(); g.moveTo(L, y(st.off_at)); g.lineTo(W - R, y(st.off_at)); g.stroke();
    g.setLineDash([]);
  }
  // temperature (gaps on sensor errors)
  g.strokeStyle = css('--accent'); g.lineWidth = 2; g.beginPath();
  let pen = false;
  for (const p of pts) {
    if (p.c === null) { pen = false; continue; }
    pen ? g.lineTo(x(p.t), y(p.c)) : g.moveTo(x(p.t), y(p.c)); pen = true;
  }
  g.stroke();
}
window.addEventListener('resize', draw);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);

refresh(); loadHistory(true);
setInterval(refresh, 2000);
setInterval(() => loadHistory(false), 15000);
</script>
</body>
</html>
